<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Pokedex</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <h1>Indrakedex</h1>

  <!-- searchbar -->
  <input
    type="text"
    id="barra-busqueda"
    placeholder="Busca un pokemon por nombre"
  >

  <!-- mensajes -->
  <p id="mensaje"></p>

  <!-- tarjetonas -->
  <div id="lista-pokemon"></div>

  <!-- ventanita de info del pokemon -->
  <dialog id="ventana-detalles">
    <div id="contenido-detalles"></div>
    <button id="boton-cerrar">Cerrar</button>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
